apiVersion: apps/v1
kind: Deployment
metadata:
  name: seckill-web
  namespace: seckill
  labels:
    app: seckill-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seckill-web
  template:
    metadata:
      labels:
        app: seckill-web
    spec:
      containers:
        - name: web
          image: seckill-web:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: 32Mi
              cpu: 20m
            limits:
              memory: 128Mi
              cpu: 200m
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: seckill-web
  namespace: seckill
spec:
  type: NodePort
  externalIPs:
    - 192.168.2.53
  selector:
    app: seckill-web
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080

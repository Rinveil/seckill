apiVersion: v1
kind: Secret
metadata:
  name: seckill-secrets
  namespace: seckill
type: Opaque
stringData:
  # 本地演示默认值；勿写入业务 application 明文密钥字段
  MYSQL_ROOT_PASSWORD: seckill
  MYSQL_DATABASE: seckill
  JWT_SECRET: seckill-demo-jwt-secret-change-me-32b
  SEED_ADMIN_USERNAME: admin
  SEED_ADMIN_PASSWORD: admin123
  SEED_ADMIN_NICKNAME: 管理员
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init
  namespace: seckill
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS t_user (
        id BIGINT PRIMARY KEY AUTO_INCREMENT,
        username VARCHAR(64) NOT NULL UNIQUE,
        password_hash VARCHAR(100) NOT NULL,
        role VARCHAR(16) NOT NULL,
        nickname VARCHAR(64) NOT NULL,
        status TINYINT NOT NULL DEFAULT 1,
        created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE IF NOT EXISTS t_activity (
        id BIGINT PRIMARY KEY AUTO_INCREMENT,
        title VARCHAR(128) NOT NULL,
        price_fen INT NOT NULL,
        origin_price_fen INT NOT NULL,
        stock INT NOT NULL,
        status TINYINT NOT NULL DEFAULT 0,
        start_at DATETIME NOT NULL,
        end_at DATETIME NOT NULL,
        limit_per_user INT NOT NULL DEFAULT 1
    );

    CREATE TABLE IF NOT EXISTS t_order (
        id BIGINT PRIMARY KEY AUTO_INCREMENT,
        order_no VARCHAR(64) NOT NULL UNIQUE,
        user_id BIGINT NOT NULL,
        activity_id BIGINT NOT NULL,
        amount_fen INT NOT NULL,
        status VARCHAR(32) NOT NULL,
        created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,
        expire_at DATETIME NULL
    );

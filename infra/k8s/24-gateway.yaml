apiVersion: apps/v1
kind: Deployment
metadata:
  name: seckill-gateway
  namespace: seckill
  labels:
    app: seckill-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seckill-gateway
  template:
    metadata:
      labels:
        app: seckill-gateway
    spec:
      containers:
        - name: app
          image: seckill-gateway:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: JAVA_OPTS
              value: "-Xms128m -Xmx256m"
            - name: SERVER_PORT
              value: "8080"
            - name: SECKILL_USER_URI
              value: http://seckill-user:8081
            - name: SECKILL_ACTIVITY_URI
              value: http://seckill-activity:8082
            - name: SECKILL_CORE_URI
              value: http://seckill-core:8083
            - name: SECKILL_ORDER_URI
              value: http://seckill-order:8084
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: seckill-secrets
                  key: JWT_SECRET
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: "1"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 25
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: seckill-gateway
  namespace: seckill
spec:
  selector:
    app: seckill-gateway
  ports:
    - port: 8080
      targetPort: 8080

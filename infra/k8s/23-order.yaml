apiVersion: apps/v1
kind: Deployment
metadata:
  name: seckill-order
  namespace: seckill
  labels:
    app: seckill-order
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seckill-order
  template:
    metadata:
      labels:
        app: seckill-order
    spec:
      containers:
        - name: app
          image: seckill-order:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8084
          env:
            - name: JAVA_OPTS
              value: "-Xms128m -Xmx256m"
            - name: SERVER_PORT
              value: "8084"
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: "1"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8084
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8084
            initialDelaySeconds: 40
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: seckill-order
  namespace: seckill
spec:
  selector:
    app: seckill-order
  ports:
    - port: 8084
      targetPort: 8084

apiVersion: apps/v1
kind: Deployment
metadata:
  name: seckill-order
  namespace: seckill
  labels:
    app: seckill-order
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seckill-order
  template:
    metadata:
      labels:
        app: seckill-order
    spec:
      containers:
        - name: app
          image: seckill-order:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8084
          env:
            - name: JAVA_OPTS
              value: "-Xms128m -Xmx256m"
            - name: SERVER_PORT
              value: "8084"
            - name: MYSQL_URL
              value: jdbc:mysql://mysql:3306/seckill?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
            - name: MYSQL_USER
              value: root
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seckill-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: SPRING_DATA_REDIS_HOST
              value: redis
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: SPRING_RABBITMQ_HOST
              value: rabbitmq
            - name: SPRING_RABBITMQ_PORT
              value: "5672"
            - name: SPRING_RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: seckill-secrets
                  key: RABBITMQ_DEFAULT_USER
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seckill-secrets
                  key: RABBITMQ_DEFAULT_PASS
            - name: ORDER_EXPIRE_MINUTES
              value: "3"
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: "1"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8084
            initialDelaySeconds: 25
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8084
            initialDelaySeconds: 50
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: seckill-order
  namespace: seckill
spec:
  selector:
    app: seckill-order
  ports:
    - port: 8084
      targetPort: 8084

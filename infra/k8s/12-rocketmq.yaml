apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rocketmq-broker-data
  namespace: seckill
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rocketmq-broker-config
  namespace: seckill
data:
  broker.conf: |
    brokerClusterName = DefaultCluster
    brokerName = broker-a
    brokerId = 0
    deleteWhen = 04
    fileReservedTime = 48
    brokerRole = ASYNC_MASTER
    flushDiskType = ASYNC_FLUSH
    brokerIP1 = rocketmq-broker
    namesrvAddr = rocketmq-namesrv:9876
    autoCreateTopicEnable = true
    autoCreateSubscriptionGroup = true
    timerWheelEnable = true
    # Local K8s: keep mapped files small to fit ~1Gi broker limit
    mappedFileSizeCommitLog = 16777216
    mappedFileSizeConsumeQueue = 100000
    maxMessageSize = 4194304
    sendMessageThreadPoolNums = 4
    pullMessageThreadPoolNums = 4
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rocketmq-namesrv
  namespace: seckill
  labels:
    app: rocketmq-namesrv
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rocketmq-namesrv
  template:
    metadata:
      labels:
        app: rocketmq-namesrv
    spec:
      containers:
        - name: namesrv
          image: apache/rocketmq:5.1.4
          imagePullPolicy: IfNotPresent
          command: ["sh", "mqnamesrv"]
          ports:
            - containerPort: 9876
              name: namesrv
          env:
            - name: JAVA_OPT_EXT
              value: "-Xms64m -Xmx128m"
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: "500m"
          readinessProbe:
            tcpSocket:
              port: 9876
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9876
            initialDelaySeconds: 40
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: rocketmq-namesrv
  namespace: seckill
spec:
  selector:
    app: rocketmq-namesrv
  ports:
    - name: namesrv
      port: 9876
      targetPort: 9876
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rocketmq-broker
  namespace: seckill
  labels:
    app: rocketmq-broker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rocketmq-broker
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: rocketmq-broker
    spec:
      containers:
        - name: broker
          image: apache/rocketmq:5.1.4
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - mqbroker
            - -n
            - rocketmq-namesrv:9876
            - -c
            - /etc/rocketmq/broker.conf
          ports:
            - containerPort: 10909
            - containerPort: 10911
            - containerPort: 10912
          env:
            - name: JAVA_OPT_EXT
              value: "-Xms128m -Xmx256m -XX:MaxDirectMemorySize=128m -XX:+UseG1GC"
            - name: NAMESRV_ADDR
              value: rocketmq-namesrv:9876
          resources:
            requests:
              memory: 384Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: "1"
          volumeMounts:
            - name: data
              mountPath: /home/rocketmq/store
            - name: conf
              mountPath: /etc/rocketmq/broker.conf
              subPath: broker.conf
          readinessProbe:
            tcpSocket:
              port: 10911
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 18
          livenessProbe:
            tcpSocket:
              port: 10911
            initialDelaySeconds: 60
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rocketmq-broker-data
        - name: conf
          configMap:
            name: rocketmq-broker-config
---
apiVersion: v1
kind: Service
metadata:
  name: rocketmq-broker
  namespace: seckill
spec:
  selector:
    app: rocketmq-broker
  ports:
    - name: main
      port: 10911
      targetPort: 10911
    - name: ha
      port: 10912
      targetPort: 10912
    - name: vip
      port: 10909
      targetPort: 10909

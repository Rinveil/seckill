apiVersion: apps/v1
kind: Deployment
metadata:
  name: seckill-core
  namespace: seckill
  labels:
    app: seckill-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seckill-core
  template:
    metadata:
      labels:
        app: seckill-core
    spec:
      containers:
        - name: app
          image: seckill-core:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          env:
            - name: JAVA_OPTS
              value: "-Xms64m -Xmx192m"
            - name: SERVER_PORT
              value: "8083"
            - name: SPRING_DATA_REDIS_HOST
              value: redis
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: ROCKETMQ_NAME_SERVER
              value: rocketmq-namesrv:9876
            - name: SECKILL_MQ_ENABLED
              value: "false"
            - name: SECKILL_SCHEDULE_ENABLED
              value: "false"
            - name: SECKILL_ORDER_URI
              value: http://seckill-order:8084
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 384Mi
              cpu: "1"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            initialDelaySeconds: 25
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            initialDelaySeconds: 50
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: seckill-core
  namespace: seckill
spec:
  selector:
    app: seckill-core
  ports:
    - port: 8083
      targetPort: 8083

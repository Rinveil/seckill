apiVersion: apps/v1
kind: Deployment
metadata:
  name: seckill-user
  namespace: seckill
  labels:
    app: seckill-user
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seckill-user
  template:
    metadata:
      labels:
        app: seckill-user
    spec:
      containers:
        - name: app
          image: seckill-user:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: JAVA_OPTS
              value: "-Xms128m -Xmx256m"
            - name: SERVER_PORT
              value: "8081"
            - name: MYSQL_URL
              value: jdbc:mysql://mysql:3306/seckill?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
            - name: MYSQL_USER
              value: root
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seckill-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: seckill-secrets
                  key: JWT_SECRET
            - name: SEED_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: seckill-secrets
                  key: SEED_ADMIN_USERNAME
            - name: SEED_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seckill-secrets
                  key: SEED_ADMIN_PASSWORD
            - name: SEED_ADMIN_NICKNAME
              valueFrom:
                secretKeyRef:
                  name: seckill-secrets
                  key: SEED_ADMIN_NICKNAME
            - name: SPRING_DATA_REDIS_HOST
              value: redis
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 384Mi
              cpu: "1"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 25
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 50
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: seckill-user
  namespace: seckill
spec:
  selector:
    app: seckill-user
  ports:
    - port: 8081
      targetPort: 8081

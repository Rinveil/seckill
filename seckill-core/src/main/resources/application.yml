server:
  port: 8083

spring:
  application:
    name: seckill-core
  autoconfigure:
    # MQ 关闭时排除；开启时设 SECKILL_MQ_AUTOCONFIG_EXCLUDE=（空）并 SECKILL_MQ_ENABLED=true
    exclude: ${SECKILL_MQ_AUTOCONFIG_EXCLUDE:org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:rabbitmq}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:seckill}
    password: ${SPRING_RABBITMQ_PASSWORD:seckill}

seckill:
  mq:
    enabled: ${SECKILL_MQ_ENABLED:false}
  schedule:
    enabled: ${SECKILL_SCHEDULE_ENABLED:false}
  order-uri: ${SECKILL_ORDER_URI:http://seckill-order:8084}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

name: Deploy to local Docker Desktop K8s

# 说明：不是云端 K8s 主动拉 Git，而是 Mac 上的 self-hosted runner
# 收到 GitHub push 事件后，在本机 docker build + kubectl apply。
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: local-k8s-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          echo "host=$(hostname)"
          docker version
          kubectl config current-context
          kubectl get nodes

      - name: Build images and deploy
        run: |
          chmod +x infra/scripts/*.sh
          ./infra/scripts/ci-deploy.sh

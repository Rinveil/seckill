server:
  port: 8080

spring:
  application:
    name: seckill-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: user
          uri: ${SECKILL_USER_URI:http://seckill-user:8081}
          predicates:
            - Path=/api/user/**
        - id: activity
          uri: ${SECKILL_ACTIVITY_URI:http://seckill-activity:8082}
          predicates:
            - Path=/api/activity/**
        - id: seckill
          uri: ${SECKILL_CORE_URI:http://seckill-core:8083}
          predicates:
            - Path=/api/seckill/**
        - id: order
          uri: ${SECKILL_ORDER_URI:http://seckill-order:8084}
          predicates:
            - Path=/api/order/**

seckill:
  jwt:
    secret: ${JWT_SECRET}
  auth:
    whitelist:
      - /api/user/login
      - /api/user/register
      - /actuator

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

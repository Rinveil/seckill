server:
  port: 8080

spring:
  application:
    name: seckill-gateway
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: user
          uri: ${SECKILL_USER_URI:http://seckill-user:8081}
          predicates:
            - Path=/api/user/**
        - id: activity
          uri: ${SECKILL_ACTIVITY_URI:http://seckill-activity:8082}
          predicates:
            - Path=/api/activity/**,/api/mall/**
        - id: seckill
          uri: ${SECKILL_CORE_URI:http://seckill-core:8083}
          predicates:
            - Path=/api/seckill/**
        - id: order
          uri: ${SECKILL_ORDER_URI:http://seckill-order:8084}
          predicates:
            - Path=/api/order/**

seckill:
  jwt:
    secret: ${JWT_SECRET}
  ratelimit:
    capacity: ${SECKILL_RATELIMIT_CAPACITY:10}
    refill-qps: ${SECKILL_RATELIMIT_QPS:50}
  auth:
    whitelist:
      - /api/user/login
      - /api/user/register
      - /api/mall/**
      - /actuator

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: false

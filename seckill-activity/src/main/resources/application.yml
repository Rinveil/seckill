server:
  port: 8082

spring:
  application:
    name: seckill-activity
  autoconfigure:
    exclude: ${SECKILL_MQ_AUTOCONFIG_EXCLUDE:org.apache.rocketmq.spring.autoconfigure.RocketMQAutoConfiguration}
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://mysql:3306/seckill?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:rocketmq-namesrv:9876}
  producer:
    group: seckill-activity-producer
    send-message-timeout: 5000

seckill:
  mq:
    enabled: ${SECKILL_MQ_ENABLED:false}
  schedule:
    enabled: ${SECKILL_SCHEDULE_ENABLED:false}
  search:
    elasticsearch:
      enabled: ${SECKILL_SEARCH_ES_ENABLED:false}
      uris: ${ELASTICSEARCH_URIS:http://elasticsearch:9200}
      reconcile-ms: ${SECKILL_SEARCH_ES_RECONCILE_MS:120000}
  activity:
    expire-scan-ms: ${ACTIVITY_EXPIRE_SCAN_MS:30000}
    reconcile-scan-ms: ${ACTIVITY_RECONCILE_SCAN_MS:60000}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  health:
    elasticsearch:
      enabled: false
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

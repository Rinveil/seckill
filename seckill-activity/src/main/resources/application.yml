server:
  port: 8082

spring:
  application:
    name: seckill-activity
  autoconfigure:
    exclude: ${SECKILL_MQ_AUTOCONFIG_EXCLUDE:org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration}
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://mysql:3306/seckill?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:rabbitmq}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:seckill}
    password: ${SPRING_RABBITMQ_PASSWORD:seckill}
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false

seckill:
  mq:
    enabled: ${SECKILL_MQ_ENABLED:false}
  schedule:
    enabled: ${SECKILL_SCHEDULE_ENABLED:false}
  activity:
    expire-scan-ms: ${ACTIVITY_EXPIRE_SCAN_MS:30000}
    reconcile-scan-ms: ${ACTIVITY_RECONCILE_SCAN_MS:60000}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
